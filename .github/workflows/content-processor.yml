name: Content Processor Pipeline
on:
  push:
    paths:
      - 'content/**'
      - '.github/workflows/content-processor.yml'
  pull_request:
    paths:
      - 'content/**'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all content'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18'
  CACHE_VERSION: 'v1'

jobs:
  validate-content:
    name: Validate Content Structure
    runs-on: ubuntu-latest
    outputs:
      has-projects: ${{ steps.check.outputs.has-projects }}
      has-papers: ${{ steps.check.outputs.has-papers }}
      has-testimonials: ${{ steps.check.outputs.has-testimonials }}
      content-changed: ${{ steps.changes.outputs.content }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for content changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            content:
              - 'content/**'
            projects:
              - 'content/projects/**'
            papers:
              - 'content/papers/**'
            testimonials:
              - 'content/testimonials/**'

      - name: Check content directories
        id: check
        run: |
          echo "has-projects=$([ -d content/projects ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has-papers=$([ -d content/papers ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has-testimonials=$([ -d content/testimonials ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Validate content structure
        run: |
          node scripts/validate-content.js
        if: steps.changes.outputs.content == 'true' || github.event.inputs.force_rebuild == 'true'

  process-content:
    name: Process Content Files
    runs-on: ubuntu-latest
    needs: validate-content
    if: needs.validate-content.outputs.content-changed == 'true' || github.event.inputs.force_rebuild == 'true'

    strategy:
      matrix:
        content-type: [projects, papers, testimonials]
        exclude:
          - content-type: projects
            condition: ${{ needs.validate-content.outputs.has-projects != 'true' }}
          - content-type: papers
            condition: ${{ needs.validate-content.outputs.has-papers != 'true' }}
          - content-type: testimonials
            condition: ${{ needs.validate-content.outputs.has-testimonials != 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ env.CACHE_VERSION }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.CACHE_VERSION }}-

      - name: Install dependencies
        run: |
          npm init -y 2>/dev/null || true
          npm install --save-dev pdf-parse sharp markdown-it gray-matter fs-extra glob natural fuse.js lunr

      - name: Process content type
        run: |
          if [ "${{ matrix.content-type }}" = "papers" ]; then
            node scripts/enhanced-pdf-processor.js
          else
            node scripts/process-${{ matrix.content-type }}.js
          fi
        env:
          CONTENT_TYPE: ${{ matrix.content-type }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}

      - name: Upload processed data
        uses: actions/upload-artifact@v3
        with:
          name: processed-${{ matrix.content-type }}
          path: |
            data/${{ matrix.content-type }}.json
            assets/images/${{ matrix.content-type }}/
            assets/thumbnails/${{ matrix.content-type }}/
          retention-days: 1

  optimize-assets:
    name: Optimize Images and Assets
    runs-on: ubuntu-latest
    needs: [validate-content, process-content]
    if: needs.validate-content.outputs.content-changed == 'true' || github.event.inputs.force_rebuild == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install optimization dependencies
        run: |
          npm install --save-dev sharp imagemin imagemin-webp imagemin-mozjpeg imagemin-pngquant

      - name: Download all processed content
        uses: actions/download-artifact@v3
        with:
          path: temp-artifacts/

      - name: Optimize images
        run: |
          node scripts/optimize-images.js
        env:
          MAX_WIDTH: 1920
          QUALITY: 85
          WEBP_QUALITY: 80

      - name: Generate responsive images
        run: |
          node scripts/generate-responsive.js
        env:
          BREAKPOINTS: "320,640,768,1024,1280,1920"

      - name: Upload optimized assets
        uses: actions/upload-artifact@v3
        with:
          name: optimized-assets
          path: |
            assets/images/
            assets/thumbnails/
            assets/optimized/
          retention-days: 1

  generate-metadata:
    name: Generate Site Metadata
    runs-on: ubuntu-latest
    needs: [process-content, optimize-assets]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download processed content
        uses: actions/download-artifact@v3
        with:
          path: temp-artifacts/

      - name: Merge processed data
        run: |
          mkdir -p data/
          find temp-artifacts/ -name "*.json" -exec cp {} data/ \;

      - name: Generate site metadata
        run: |
          node scripts/generate-metadata.js
        env:
          SITE_URL: ${{ github.event.repository.html_url }}
          BUILD_TIMESTAMP: ${{ github.run_id }}

      - name: Generate search index
        run: |
          node scripts/generate-search-index.js

      - name: Upload final data
        uses: actions/upload-artifact@v3
        with:
          name: final-data
          path: |
            data/
          retention-days: 1

  deploy-changes:
    name: Deploy Generated Content
    runs-on: ubuntu-latest
    needs: [generate-metadata, optimize-assets]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: temp-artifacts/

      - name: Merge all generated content
        run: |
          # Create directories if they don't exist
          mkdir -p data/ assets/images/ assets/thumbnails/ assets/optimized/

          # Copy processed data
          find temp-artifacts/final-data/ -name "*.json" -exec cp {} data/ \; 2>/dev/null || true

          # Copy optimized assets
          cp -r temp-artifacts/optimized-assets/assets/* assets/ 2>/dev/null || true

      - name: Check for changes
        id: verify-changes
        run: |
          git add data/ assets/
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --staged --name-only
          fi

      - name: Commit and push changes
        if: steps.verify-changes.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Content Processor"
          git commit -m "🤖 Auto-update: Process content and optimize assets

          - Updated content data files
          - Optimized images and assets
          - Generated responsive image variants
          - Updated site metadata and search index

          Build: ${{ github.run_id }}
          Commit: ${{ github.sha }}"
          git push

  notify-completion:
    name: Notify Processing Complete
    runs-on: ubuntu-latest
    needs: [deploy-changes]
    if: always()

    steps:
      - name: Processing Summary
        run: |
          echo "## Content Processing Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Build ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ needs.deploy-changes.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Generated Files**: Check data/ and assets/ directories" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.deploy-changes.result }}" = "success" ]; then
            echo "✅ Content processing completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Content processing failed - check workflow logs" >> $GITHUB_STEP_SUMMARY
          fi